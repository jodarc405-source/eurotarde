databases:
  - name: eurotarde-db
    plan: free
    databaseName: eurotarde
    user: eurotarde

services:
  - type: web
    name: eurotarde
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Secrets NÃO vivem no repo (repo é público).
      # sync: false => o Render mantém o valor definido no dashboard;
      # o valor em plaintext aqui foi removido por motivos de segurança.
      # Ação manual pendente: definir SECRET_KEY e ADMIN_DEFAULT_PASSWORD
      # no dashboard do Render com os novos valores gerados.
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: eurotarde-db
          property: connectionString
      - key: ADMIN_DEFAULT_USERNAME
        value: admin
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: DRAW_UPDATE_HOUR
        value: "0"
      - key: DRAW_UPDATE_MINUTE
        value: "0"
      - key: SESSION_MAX_AGE
        value: "3600"
