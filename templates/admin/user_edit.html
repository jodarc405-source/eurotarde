{% extends "base.html" %}
{% block title %}Editar Utilizador - Eurotarde{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="fas fa-user-edit me-2"></i>Editar Utilizador: {{ user.username }}</h2>

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary-euro text-white">
                <h5 class="mb-0">Dados do Utilizador</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="/admin/users/{{ user.id }}/edit">
                    <div class="mb-3">
                        <label class="form-label">Utilizador</label>
                        <input type="text" class="form-control" value="{{ user.username }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" value="{{ user.email }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nova Palavra-passe (deixar vazio para manter)</label>
                        <input type="password" name="new_password" class="form-control" minlength="6">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if user.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">Conta ativa</label>
                    </div>
                    <button type="submit" class="btn btn-success me-2">Guardar</button>
                    <a href="/admin/users" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
