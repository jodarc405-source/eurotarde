{% extends "base.html" %}
{% block title %}Inserir Sorteio Manual - Eurotarde{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="fas fa-plus me-2"></i>Inserir Sorteio Manual</h2>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary-euro text-white">
                <h5 class="mb-0">Dados do Sorteio</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="/admin/draws/manual">
                    <div class="mb-3">
                        <label class="form-label">Data do Sorteio</label>
                        <input type="date" name="draw_date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Números (1-50)</label>
                        <div class="row g-2">
                            {% for i in range(1, 6) %}
                            <div class="col">
                                <select name="n{{ i }}" class="form-select" required>
                                    <option value="{{ i }}">{{ i }}</option>
                                    {% for n in range(1, 51) %}
                                    <option value="{{ n }}">{{ n }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Estrelas (1-12)</label>
                        <div class="row g-2">
                            <div class="col">
                                <select name="s1" class="form-select" required>
                                    {% for s in range(1, 13) %}
                                    <option value="{{ s }}">{{ s }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col">
                                <select name="s2" class="form-select" required>
                                    {% for s in range(1, 13) %}
                                    <option value="{{ s }}">{{ s }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Jackpot (€)</label>
                        <input type="number" step="0.01" name="prize_total" class="form-control" value="0">
                    </div>
                    <button type="submit" class="btn btn-success me-2">Inserir Sorteio</button>
                    <a href="/sorteios" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
