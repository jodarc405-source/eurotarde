{% extends "base.html" %}
{% block title %}Criar Utilizador - Eurotarde{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="fas fa-user-plus me-2"></i>Criar Novo Utilizador</h2>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary-euro text-white">
                <h5 class="mb-0">Dados do Utilizador</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="/admin/users/create">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_admin" name="is_admin">
                        <label class="form-check-label" for="is_admin">Administrador</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary-euro">
                            <i class="fas fa-plus me-1"></i>Criar Utilizador
                        </button>
                        <a href="/admin/users" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
