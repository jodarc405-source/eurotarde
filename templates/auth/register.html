{% extends "base.html" %}
{% block title %}Registar - Eurotarde{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary-euro text-white text-center">
                <h3><i class="fas fa-user-plus me-2"></i>Registar</h3>
            </div>
            <div class="card-body p-4">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <form method="POST" action="/auth/register">
                    <div class="mb-3">
                        <label for="username" class="form-label">Utilizador</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Palavra-passe</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirmar Palavra-passe</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    <button type="submit" class="btn btn-primary-euro w-100">Registar</button>
                </form>
                <hr>
                <p class="text-center mb-0">Já tem conta? <a href="/auth/login">Entre aqui</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
