{% extends "base.html" %}
{% block title %}Entrar - Eurotarde{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4 col-sm-8">
        <div class="card shadow-lg" style="border-color: rgba(99,102,241,0.2) !important;">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="mb-3" style="font-size: 2.5rem;">
                        <i class="fas fa-star" style="color: var(--accent); filter: drop-shadow(0 0 12px rgba(245,158,11,0.5));"></i>
                    </div>
                    <h4 style="font-weight: 800; letter-spacing: -0.02em;">Eurotarde</h4>
                    <p class="text-muted" style="font-size: 0.85rem;">Inicia sessão para continuar</p>
                </div>

                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}

                <form method="POST" action="/auth/login">
                    <div class="mb-3">
                        <label class="form-label">Utilizador</label>
                        <div class="input-group">
                            <span class="input-group-text" style="background: var(--bg-glass); border-color: var(--bg-glass-border); color: var(--text-muted);">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" name="username" class="form-control" placeholder="Nome de utilizador" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Palavra-passe</label>
                        <div class="input-group">
                            <span class="input-group-text" style="background: var(--bg-glass); border-color: var(--bg-glass-border); color: var(--text-muted);">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" name="password" class="form-control" placeholder="Palavra-passe" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3" style="padding: 0.7rem;">
                        <i class="fas fa-sign-in-alt me-2"></i>Entrar
                    </button>
                </form>
                <div class="text-center">
                    <span class="text-muted" style="font-size: 0.85rem;">Não tens conta? </span>
                    <a href="/auth/register" style="font-weight: 600;">Registar</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
